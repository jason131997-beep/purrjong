  <g fill="none" stroke="#D8C9A8" stroke-width="3" opacity=".4" stroke-linecap="round">
    <path d="M175,480 q8,-20 0,-40 q-8,-18 0,-36"/>
    <path d="M195,470 q8,-18 0,-36 q-8,-16 0,-32"/>
    <path d="M215,480 q8,-20 0,-40 q-8,-18 0,-36"/>
  </g>
  <!-- teapot silhouette -->
