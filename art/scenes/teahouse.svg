  </defs>
  <rect width="390" height="844" fill="url(#sky)"/>
  <!-- shoji panels -->
  <g opacity=".28" stroke="#C9B48A" stroke-width="2" fill="#F3D9A9">
    <rect x="20" y="120" width="90" height="200" rx="4"/>
    <path d="M20,170 H110 M20,220 H110 M50,120 V320 M80,120 V320"/>
    <rect x="280" y="120" width="90" height="200" rx="4"/>
    <path d="M280,170 H370 M280,220 H370 M310,120 V320 M340,120 V320"/>
  </g>
  <!-- roof curve -->
  <path d="M40,140 Q195,70 350,140" fill="none" stroke="#D4B88A" stroke-width="10" opacity=".35" stroke-linecap="round"/>
  <!-- tatami floor bands -->
  <g opacity=".3">
    <rect x="0" y="560" width="390" height="40" fill="#E8D5A8"/>
    <rect x="0" y="620" width="390" height="40" fill="#E2CFA0"/>
    <rect x="0" y="680" width="390" height="40" fill="#E8D5A8"/>
    <rect x="0" y="740" width="390" height="40" fill="#E2CFA0"/>
  </g>
