    <g transform="translate(275 222)"><ellipse cx="0" cy="18" rx="11" ry="14" fill="#F08A6B"/><rect x="-6" y="2" width="12" height="4" fill="#8C6656"/><rect x="-6" y="30" width="12" height="4" fill="#8C6656"/></g>
